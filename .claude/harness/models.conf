# Which model each phase of a story runs on. Read by `scripts/plan.sh`, which
# writes the plan into the story's `## Model guidance` before the phase starts.
#
# This file exists because the alternative is asking a human every time, and a
# question asked every time stops being answered and starts being habit.
# `rules.md` puts it more sharply: a model choice with no recorded verdict is
# folklore. A plan in a file with a reason per row is the opposite of folklore,
# and it is falsifiable - change a row, run the stories, see whether anything
# got worse.
#
# WHAT THE ROWS ARE BASED ON. A split by KIND OF WORK, decided by the user on
# 2026-10-05 (release 78): Opus 5.5 is now the better model for writing and
# testing code, and Fable the better one for planning, architecture and running
# a multi-stage workflow. Revised by the user on 2026-11-11 (release 120),
# because `fable` usage was outrunning overall usage: `fable` keeps the
# highest-leverage judgement - planning, the diff review, reading review
# feedback against the contract - and the high-volume, mostly mechanical work of
# orchestrating a story through its phases moves to `opus`. So:
#
#   fable  the judgement work, reached inside a story by DISPATCH to `lead-po`:
#          PLANNED (decomposition, the oracle partition, the contract),
#          DIFF-REVIEW (the whole-diff review that opens GATES -> REVIEW),
#          REVIEW (reading PR feedback against that contract) and, since
#          HARNESS-102, ADJUDICATE (judging a claim that the contract itself
#          is wrong, in whatever phase it is made). The planning
#          commands (`/create-product`, `/plan-product`, `/plan-story`) and
#          the planning agents (`lead-po`, `lead-designer`) declare `fable`.
#   opus   every phase that writes or tests code - RED, GREEN, GATES, SCAFFOLD -
#          the agents that do it (`test-developer`, `feature-developer`,
#          `mutation-tester`), and, since 2026-11-11, the commands that run the
#          story loop (`/advance-story`, `/complete-story`) and `/security-audit`.
#          The orchestrator is on `opus` and dispatches the `fable` rows.
#
# What this replaced, and what it keeps. Until release 77 the rows were a
# ladder - `opus` the stronger model everywhere, `fable` the weaker one in RED
# when a partitioned brief existed, with three exceptions sending RED back to
# `opus` when it did not. That rested on one controlled measurement, recorded in
# `rules.md`: the brief out-performed the model. It does not carry over to a
# split where the RED model is the one judged better at the work, so the
# exceptions are retired rather than inverted; the mechanism stays in plan.sh
# for a project that wants a conditional row again.
#
# The asymmetry the old design rested on survives intact: GREEN and GATES were
# on `opus` and stay there. The failure mode of a weaker model in those phases
# is reaching green by weakening a test, which is the one thing this harness
# was built to prevent; nothing in this file may move them to a model judged
# weaker at the work. A story that wants a different answer says so in its own
# `## Model guidance` with a success condition, not by editing this file.
#
# THIS IS A PLAN, NOT A RECORD. The orchestrator still writes down the model
# each dispatch RESOLVED to, by name, because a session setting or an explicit
# override can beat both this file and the agent's own `model:` field, and
# nothing here can see which won. The verdict on this split is those records:
# if a RED on `opus` produces weaker negative controls than the fable RED
# stories before release 78, or a PLANNED on `fable` produces contracts that
# RED has to send back, this file is wrong and should say so.
#
# Format:
#   model  | <PHASE> | <agent>     | <model> | <why>
#   except | <PHASE> | <condition> | <model> | <why>
#
# <PHASE> is a phase of phases.conf or a named STEP inside one. Two steps ship.
# `DIFF-REVIEW`, the fresh whole-diff review that opens GATES -> REVIEW, is on
# `lead-po` rather than `feature-developer` because a dispatch that loses its
# explicit model falls back to the agent's own `model:`, and `lead-po` declares
# the same `fable` this row plans. `ADJUDICATE`, the fresh dispatch that judges
# a claim that an acceptance criterion, a threshold or a frozen test is wrong,
# is on `lead-po` for the same reason; it can be needed in any phase, so it is
# the last row rather than one between two phases. plan.sh prints and renders
# a step row exactly like a phase row; it does not check the column against
# phases.conf.
#
# Exceptions are consulted first and the first match wins. None ship today.
# Conditions are evaluated against the story file:
#
#   type=<t>      the story's frontmatter `type`
#   no-contract   `## Contract` is empty or template-only
#   unenforced    every path the contract names is one the phase lock will not
#                 freeze. `harness` is in every phase's list in phases.conf, and
#                 `.claude/tests/*`, `scripts/*` and `.claude/hooks/*` all
#                 classify as `harness`. One source path is enough for the lock
#                 to bite, so this needs ALL of them.
#
# Models must be names that can actually be dispatched: opus, fable, sonnet,
# haiku. A typo here is not an error, it is a silent fall back to whatever the
# session was set to - which is the state this file replaces.

model  | PLANNED  | lead-po           | fable | planning is the judgement phase - decomposition, the oracle partition, the contract - and planning is what fable is judged best at
model  | RED      | test-developer    | opus  | writing the failing tests, the negative controls and the handoff is development work, and opus is judged the stronger model for it
model  | GREEN    | feature-developer | opus  | the failure mode of a weaker model here is reaching green by weakening a test, which is the one thing this harness exists to prevent
model  | GATES    | feature-developer | opus  | same risk as GREEN, and a gate failure is where "make it stop complaining" is most tempting
model  | DIFF-REVIEW | lead-po        | fable | reading a whole diff for the defect no test was written for is judgement against the contract, and it is where a wrong call ships; a finding it labels goes back to GATES or RED, on opus
model  | REVIEW   | lead-po           | fable | reading review feedback against the contract is orchestration judgement, and a wrong call here ships; a fix it finds goes back to GATES or RED, on opus
model  | SCAFFOLD | lead-po           | opus  | source, tests and config in one indivisible derivation - code, with no failing test in front of any of it, so the stronger development model
model  | ADJUDICATE | lead-po        | fable | a claim that an acceptance criterion, a threshold or a frozen test is wrong is judged against the contract by a fresh dispatch on different inputs, never by the orchestrator that wants the answer; needed in any phase, so it is last
